name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Run environment validator tests
        run: npm run test:env

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          LLM_PROVIDER: openai_compatible
          LLM_API_KEY: ci-placeholder
          LLM_MODEL: gpt-4o-mini
