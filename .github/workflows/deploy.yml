name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  VERCEL_ORG_ID: team_AdK5Z5PC1NUi2RVmegoA0GCn
  VERCEL_PROJECT_ID: prj_YKIfJe2tTKzveT9NgTjEfCUBKPcA

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Run environment validator tests
        run: npm run test:env

      - name: Check CI database safety
        run: npm run test:ci-db-safety

      - name: Unit & integration tests
        run: npm run test

      - name: Unit tests with coverage gate
        run: npm run test:coverage

      - name: Lint
        run: npm run lint

      - name: Build (sanity check)
        run: npm run build
        env:
          LLM_PROVIDER: openai_compatible
          LLM_API_KEY: ci-placeholder
          LLM_MODEL: gpt-4o-mini

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # Runs in parallel; does not gate preview/production deploy.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy-preview:
    name: Deploy Preview
    needs: validate
    runs-on: ubuntu-latest
    environment: preview
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Pull preview environment
        run: npm run env:pull:preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Validate preview environment
        run: npm run env:validate -- --target preview --env-file .vercel/.env.preview.local

      # Pinned: Vercel CLI ≥58's deploy readiness wait times out (~300s, silent exit 1)
      # on this project even when the deployment is live. Revisit when Vercel ships a
      # --timeout flag or fixes the wait.
      - name: Build preview artifact
        run: npx vercel@56.5.0 build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy preview
        id: deploy
        run: |
          url=$(npx vercel@56.5.0 deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $url"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Debug deploy state (TEMPORARY - remove after diagnosis)
        if: always()
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set +e
          AUTH="Authorization: Bearer ${VERCEL_TOKEN}"
          TEAM="teamId=${VERCEL_ORG_ID}"
          BASE="https://api.vercel.com"
          LIST=$(curl -s -H "$AUTH" "${BASE}/v6/deployments?projectId=${VERCEL_PROJECT_ID}&limit=1&${TEAM}")
          UID=$(echo "$LIST" | jq -r '.deployments[0].uid // empty')
          URL=$(echo "$LIST" | jq -r '.deployments[0].url // empty')
          STATE=$(echo "$LIST" | jq -r '.deployments[0].readyState // empty')
          echo "UID=$UID URL=$URL STATE=$STATE"
          if [ -z "$UID" ]; then echo "LIST RESPONSE (raw):"; echo "$LIST" | head -c 2000; exit 0; fi
          echo "=== v13 deployment detail ==="
          DETAIL=$(curl -s -H "$AUTH" "${BASE}/v13/deployments/${UID}?${TEAM}")
          echo "$DETAIL" | jq '{state, readyState, readySubstate, errorCode, errorMessage, error, buildError, checksState, aliasAssigned, buildingAt, readyAt, createdAt, name, url}' 2>/dev/null || echo "$DETAIL" | head -c 3000
          echo "=== deployment builds ==="
          echo "$DETAIL" | jq '.builds // empty' 2>/dev/null
          echo "=== build events (tail) ==="
          curl -s -H "$AUTH" "${BASE}/v2/deployments/${UID}/events?${TEAM}&builds=1" | jq -r '.[] | "\(.type) \(.text)"' 2>/dev/null | tail -c 4000
          echo
          echo "--- done ---"

  verify-preview:
    name: Verify Preview
    needs: deploy-preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Smoke test preview deployment
        run: npm run smoke:preview
        env:
          PREVIEW_URL: ${{ needs.deploy-preview.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

  notify-preview:
    name: Notify Preview
    needs: [deploy-preview, verify-preview]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${{ needs.deploy-preview.outputs.url }}`;
            const body = [
              "## Preview deployment",
              "",
              `- URL: ${url}`,
              "- Status: smoke tests passed",
              "",
              "Production deploy runs automatically after merge to \`main\`.",
            ].join("\n");
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  migrate-db:
    name: Migrate Database
    needs: verify-preview
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pin to the generation that supports the keys in supabase/config.toml
          # (passkey, webauthn, pgdelta, storage.vector, oauth_server, …).
          # Bump deliberately when updating config.toml after a local CLI upgrade.
          version: 2.109.1

      - name: Link project
        run: supabase link --project-ref ${{ vars.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push pending migrations
        run: supabase db push --linked --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  deploy-production:
    name: Deploy Production
    needs: [deploy-preview, verify-preview, migrate-db]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Pull production environment
        run: npm run env:pull:production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Validate production environment
        run: npm run env:validate -- --target production --env-file .vercel/.env.production.local

      - name: Build production artifact
        run: npx vercel@56.5.0 build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy production
        id: deploy
        run: |
          url=$(npx vercel@56.5.0 deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Production URL: $url"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Smoke test production deployment
        run: npm run smoke:preview
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
