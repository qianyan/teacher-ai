<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INFANT D Weekly Newsletter</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Noto Sans CJK SC", sans-serif; background: #F0F9FF; width: 1080px; margin: 0 auto; }
        .container { width: 1080px; position: relative; overflow: hidden; }
        :root {
            --color-red: #0284C7; --color-gold: #38BDF8; --color-green: #14B8A6; --color-cream: #BAE6FD;
            --color-bg: #F0F9FF; --color-white: #FFFFFF; --color-text: #1E3A5F; --color-text-light: #64748B;
        }
        .header { min-height: 600px; background: var(--color-cream); position: relative; overflow: hidden; }

        /* 海洋装饰 */
        .character-decoration { position: absolute; }
        .char-1 { top: 50px; left: 70px; }
        .char-2 { top: 70px; right: 90px; }
        .char-3 { bottom: 130px; left: 100px; }
        .char-4 { bottom: 110px; right: 130px; }

        .circle-decoration { position: absolute; border-radius: 50%; }
        .circle-1 { width: 180px; height: 180px; background: var(--color-gold); top: -60px; right: -40px; opacity: 0.25; }
        .circle-2 { width: 100px; height: 100px; background: var(--color-green); bottom: 120px; left: -30px; opacity: 0.35; }
        .circle-3 { width: 60px; height: 60px; background: var(--color-red); top: 220px; left: 480px; opacity: 0.2; }
        .bubble { position: absolute; border-radius: 50%; background: rgba(255, 255, 255, 0.5); border: 2px solid rgba(56, 189, 248, 0.3); }
        .bubble-1 { width: 40px; height: 40px; top: 180px; left: 200px; }
        .bubble-2 { width: 24px; height: 24px; top: 160px; left: 230px; }
        .bubble-3 { width: 32px; height: 32px; top: 100px; right: 280px; }
        .bubble-4 { width: 18px; height: 18px; top: 85px; right: 260px; }
        .header-wave { position: absolute; bottom: 0; left: 0; width: 100%; height: 70px; }
        .header-content { position: relative; z-index: 10; padding: 100px 90px 70px; text-align: center; }
        .main-title { margin-bottom: 15px; }
        .title-en { font-size: 95px; font-weight: 800; color: var(--color-text); letter-spacing: 5px; line-height: 1.1; }
        .title-en .name { font-size: 110px; }
        .title-sub { font-size: 40px; font-weight: 600; color: var(--color-gold); letter-spacing: 10px; margin-top: 8px; }
        .sub-title { font-size: 28px; font-weight: 500; color: var(--color-red); margin-bottom: 35px; letter-spacing: 2px; }
        .intro-text { background: var(--color-white); border-radius: 24px; padding: 38px 48px; margin: 0 auto; max-width: 860px; box-shadow: 0 10px 40px rgba(2, 132, 199, 0.15); border-left: 6px solid var(--color-red); }
        .intro-text p { font-size: 18px; color: var(--color-text); line-height: 1.9; margin: 0; text-align: justify; font-weight: 400; }
        .week-info { display: inline-flex; align-items: center; justify-content: center; gap: 20px; margin-top: 35px; }
        .info-badge { background: var(--color-red); padding: 14px 40px; border-radius: 50px; font-size: 20px; font-weight: 600; color: var(--color-white); box-shadow: 0 5px 20px rgba(2, 132, 199, 0.3); letter-spacing: 1px; }
        .section { padding: 50px 90px; position: relative; }
        .section-header { display: flex; align-items: center; gap: 20px; margin-bottom: 28px; }
        .section-icon { width: 58px; height: 58px; background: var(--color-red); border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 26px; flex-shrink: 0; box-shadow: 0 4px 15px rgba(2, 132, 199, 0.2); }
        .section-title { font-size: 36px; font-weight: 700; color: var(--color-red); letter-spacing: 2px; }
        .section-subtitle { font-size: 14px; color: var(--color-green); margin-top: 5px; font-weight: 400; }
        .content-box { background: var(--color-white); border-radius: 20px; padding: 32px; box-shadow: 0 4px 25px rgba(186, 230, 253, 0.6); margin-bottom: 18px; }
        .content-box p { font-size: 17px; line-height: 1.9; color: var(--color-text); margin-bottom: 14px; font-weight: 400; }
        .content-box strong { color: var(--color-red); font-weight: 600; }
        .highlight-box { background: var(--color-gold); border-radius: 18px; padding: 24px 32px; margin-top: 22px; }
        .highlight-box p { font-size: 16px; color: var(--color-text); line-height: 1.8; margin: 0; font-weight: 500; }
        .photo-grid { display: grid; gap: 16px; margin-top: 25px; }
        .photo-grid.grid-2 { grid-template-columns: repeat(2, 1fr); }
        .photo-grid.grid-3 { grid-template-columns: repeat(3, 1fr); }
        .photo-grid.grid-4 { grid-template-columns: repeat(4, 1fr); }
        .photo-item { position: relative; border-radius: 16px; overflow: hidden; box-shadow: 0 5px 20px rgba(2, 132, 199, 0.1); aspect-ratio: 16 / 9; }
        .photo-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .list-item { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 16px; padding: 20px; background: var(--color-bg); border-radius: 16px; border-left: 4px solid var(--color-red); }
        .list-icon { font-size: 24px; flex-shrink: 0; }
        .list-content h4 { font-size: 19px; font-weight: 600; color: var(--color-red); margin-bottom: 8px; }
        .list-content p { font-size: 16px; color: var(--color-text); line-height: 1.8; margin: 0; font-weight: 400; }
        .tips-section { background: var(--color-cream); padding: 60px 90px; position: relative; overflow: hidden; }
        .tips-section::before { content: ''; position: absolute; top: -60px; right: -60px; width: 200px; height: 200px; background: var(--color-red); border-radius: 50%; opacity: 0.12; }
        .tips-title { font-size: 34px; font-weight: 700; color: var(--color-red); letter-spacing: 2px; text-align: center; margin-bottom: 40px; }
        .tips-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-bottom: 32px; }
        .tip-card { background: var(--color-white); border-radius: 20px; padding: 26px; box-shadow: 0 5px 20px rgba(0, 0, 0, 0.06); }
        .tip-card h4 { font-size: 18px; font-weight: 600; color: var(--color-red); margin-bottom: 10px; }
        .tip-card p { font-size: 15px; color: var(--color-text); line-height: 1.8; margin: 0; font-weight: 400; }
        .closing-section { background: var(--color-white); border-radius: 20px; padding: 32px; text-align: center; border: 3px solid var(--color-red); }
        .closing-section h3 { font-size: 24px; font-weight: 700; color: var(--color-red); margin-bottom: 12px; }
        .closing-section p { font-size: 16px; color: var(--color-text); line-height: 1.9; margin: 0; font-weight: 400; }
        .footer { height: 65px; background: var(--color-red); display: flex; align-items: center; justify-content: center; }
        .footer-star { font-size: 20px; margin: 0 8px; color: var(--color-white); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <!-- 海星 -->
            <div class="character-decoration char-1">
                <svg width="72" height="72" viewBox="0 0 72 72">
                    <polygon points="36,4 44,26 68,28 50,44 56,68 36,56 16,68 22,44 4,28 28,26" fill="#F59E0B" stroke="#D97706" stroke-width="1.5"/>
                    <circle cx="36" cy="36" r="8" fill="#FBBF24"/>
                </svg>
            </div>

            <!-- 小鱼 -->
            <div class="character-decoration char-2">
                <svg width="80" height="50" viewBox="0 0 80 50">
                    <ellipse cx="35" cy="25" rx="28" ry="18" fill="#38BDF8"/>
                    <polygon points="63,25 78,12 78,38" fill="#0284C7"/>
                    <circle cx="22" cy="22" r="4" fill="#1E3A5F"/>
                    <circle cx="23" cy="21" r="1.5" fill="white"/>
                    <path d="M15 30 Q25 35 35 30" stroke="#0284C7" stroke-width="2" fill="none"/>
                </svg>
            </div>

            <!-- 贝壳 -->
            <div class="character-decoration char-3">
                <svg width="60" height="55" viewBox="0 0 60 55">
                    <path d="M30 5 Q50 20 50 40 Q30 52 10 40 Q10 20 30 5" fill="#F472B6" stroke="#EC4899" stroke-width="1.5"/>
                    <path d="M30 12 Q42 22 42 38 M30 12 Q18 22 18 38 M30 12 L30 45" stroke="#FBCFE8" stroke-width="1.5" fill="none"/>
                </svg>
            </div>

            <!-- 海龟 -->
            <div class="character-decoration char-4">
                <svg width="75" height="60" viewBox="0 0 75 60">
                    <ellipse cx="38" cy="32" rx="30" ry="22" fill="#14B8A6"/>
                    <ellipse cx="38" cy="32" rx="22" ry="16" fill="#0D9488"/>
                    <circle cx="12" cy="28" r="8" fill="#14B8A6"/>
                    <circle cx="64" cy="28" r="8" fill="#14B8A6"/>
                    <circle cx="10" cy="42" r="6" fill="#14B8A6"/>
                    <circle cx="66" cy="42" r="6" fill="#14B8A6"/>
                    <circle cx="32" cy="28" r="3" fill="#1E3A5F"/>
                    <circle cx="44" cy="28" r="3" fill="#1E3A5F"/>
                    <path d="M34 36 Q38 40 42 36" stroke="#1E3A5F" stroke-width="1.5" fill="none"/>
                </svg>
            </div>

            <div class="bubble bubble-1"></div>
            <div class="bubble bubble-2"></div>
            <div class="bubble bubble-3"></div>
            <div class="bubble bubble-4"></div>
            <div class="circle-decoration circle-1"></div>
            <div class="circle-decoration circle-2"></div>
            <div class="circle-decoration circle-3"></div>
            <svg class="header-wave" viewBox="0 0 1440 70" preserveAspectRatio="none">
                <path fill="#F0F9FF" d="M0,35 C240,70 480,0 720,35 C960,70 1200,0 1440,35 L1440,70 L0,70 Z"/>
            </svg>
            <div class="header-content">
                <!-- 每期仅替换下面 .name 内的英文班级名，以及 subtitle、intro-text、info-badge -->
                <div class="main-title">
                    <div class="title-en">
                        <span class="name">Infant D</span>
                    </div>
                    <div class="title-sub">Biweekly Newsletter</div>
                </div>
                <div class="sub-title">从家庭走向集体的第一步</div>
                <div class="intro-text">
                    <p>宝贝入园的两周，是他们从家庭走向集体的第一步。我们见证了太多的"第一次"：第一次离开爸爸妈妈、第一次和这么多小伙伴一起吃饭睡觉、第一次在教室里放声大笑……虽然只有短短10天，但每一个宝贝都在用自己的节奏适应着这个新环境。</p>
                </div>
                <div class="week-info">
                    <span class="info-badge">2026.3.2 - 2026.3.13</span>
                </div>
            </div>
        </div>
