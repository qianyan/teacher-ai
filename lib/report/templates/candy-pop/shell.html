<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INFANT D Weekly Newsletter</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "PingFang SC", "Noto Sans SC", "Arial Rounded MT Bold", "Segoe UI", sans-serif; background: #FFF5F7; width: 1080px; margin: 0 auto; }
        .container { width: 1080px; position: relative; overflow-x: clip; }
        :root {
            --color-red: #FF85A2; --color-gold: #FFE066; --color-green: #7DD3FC; --color-cream: #FFD6E8;
            --color-bg: #FFF5F7; --color-white: #FFFFFF; --color-text: #4A2040; --color-text-light: #8B6B82;
        }
        .header { min-height: 560px; background: linear-gradient(180deg, #FFD6E8 0%, #FFF5F7 70%); position: relative; overflow: visible; }
        .candy-float { position: absolute; animation: none; }
        .candy-1 { top: 50px; left: 80px; transform: rotate(-12deg); }
        .candy-2 { top: 90px; right: 100px; }
        .candy-3 { bottom: 160px; left: 120px; transform: rotate(20deg); }
        .candy-4 { bottom: 120px; right: 80px; transform: rotate(-8deg); }
        .dot-grid { position: absolute; inset: 0; background-image: radial-gradient(circle, rgba(255,133,162,0.15) 1.5px, transparent 1.5px); background-size: 28px 28px; opacity: 0.6; }
        .header-content { position: relative; z-index: 10; padding: 90px 80px 80px; text-align: center; }
        .main-title { margin-bottom: 12px; }
        .title-en { font-size: 92px; font-weight: 900; color: var(--color-text); letter-spacing: 4px; line-height: 1; text-shadow: 4px 4px 0 var(--color-gold); }
        .title-en .name { font-size: 108px; color: var(--color-red); display: block; }
        .title-sub { display: inline-block; font-size: 18px; font-weight: 700; color: var(--color-white); background: var(--color-green); padding: 8px 28px; border-radius: 50px; letter-spacing: 6px; margin-top: 16px; transform: rotate(-2deg); }
        .sub-title { font-size: 28px; font-weight: 700; color: var(--color-red); margin: 32px auto 28px; max-width: 780px; letter-spacing: 1px; line-height: 1.45; }
        .intro-text { background: var(--color-white); border-radius: 32px; padding: 36px 44px; margin: 0 auto; max-width: 820px; box-shadow: 8px 8px 0 var(--color-gold), 0 12px 40px rgba(255,133,162,0.15); border: 3px solid var(--color-red); transform: rotate(0.5deg); }
        .intro-text p { font-size: 18px; color: var(--color-text); line-height: 1.9; margin: 0; text-align: justify; }
        .week-info { margin-top: 36px; }
        .info-badge { display: inline-block; background: linear-gradient(135deg, var(--color-red), #FF6B9D); padding: 14px 44px; border-radius: 50px; font-size: 20px; font-weight: 800; color: var(--color-white); letter-spacing: 1px; box-shadow: 0 6px 0 #E05A80, 0 10px 24px rgba(255,133,162,0.35); }

        /* —— dynamic body: bento collage —— */
        .section { padding: 44px 60px; position: relative; }
        .section-header { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }
        .photo-grid { display: grid; gap: 16px; margin-top: 25px; }
        .photo-grid.grid-2 { grid-template-columns: repeat(2, 1fr); }
        .photo-grid.grid-3 { grid-template-columns: repeat(3, 1fr); }
        .photo-grid.grid-4 { grid-template-columns: repeat(4, 1fr); }
        .photo-item { position: relative; overflow: hidden; box-shadow: 0 6px 20px rgba(255,133,162,0.2); aspect-ratio: 16 / 9; border-radius: 16px; }
        .section-header--bento { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }
        .section-icon { width: 54px; height: 54px; background: var(--color-gold); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 26px; flex-shrink: 0; box-shadow: 3px 3px 0 var(--color-red); transform: rotate(-3deg); }
        .section-title { font-size: 36px; font-weight: 800; color: var(--color-red); letter-spacing: 2px; }
        .section-tagline { font-size: 14px; color: var(--color-green); margin-top: 4px; font-weight: 600; }
        .bento-board { display: grid; grid-template-columns: repeat(6, 1fr); grid-auto-rows: minmax(100px, auto); gap: 14px; }
        .bento-cell--text { grid-column: span 3; background: var(--color-white); border-radius: 24px; padding: 24px 28px; box-shadow: 0 4px 16px rgba(255,133,162,0.1); border: 2px solid rgba(255,224,102,0.5); }
        .bento-cell--text.span-wide { grid-column: span 4; }
        .bento-cell--photo { display: flex; align-items: center; justify-content: center; min-height: 140px; }
        .bento-cell--photo.span-2 { grid-column: span 2; }
        .bento-cell--photo.span-3 { grid-column: span 3; }
        .content-box p { font-size: 17px; line-height: 1.9; color: var(--color-text); margin-bottom: 12px; }
        .content-box strong { color: var(--color-red); font-weight: 700; }
        .highlight-box { background: var(--color-cream); border-radius: 18px; padding: 18px 22px; margin-top: 12px; }
        .highlight-box p { font-size: 15px; color: var(--color-text); line-height: 1.8; margin: 0; }
        .list-item { display: flex; gap: 12px; padding: 14px 16px; background: var(--color-bg); border-radius: 14px; margin-bottom: 10px; border-left: 4px solid var(--color-green); }
        .list-icon { font-size: 20px; }
        .list-content h4 { font-size: 17px; font-weight: 700; color: var(--color-red); margin-bottom: 4px; }
        .list-content p { font-size: 15px; color: var(--color-text); line-height: 1.75; margin: 0; }

        .photo-item { position: relative; overflow: hidden; width: 100%; height: 100%; min-height: 120px; box-shadow: 0 6px 20px rgba(255,133,162,0.2); }
        .photo-item img { width: 100%; height: 100%; object-fit: cover; display: block; min-height: inherit; }
        .photo-item--hex { clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%); aspect-ratio: 1; max-width: 160px; margin: auto; border: 4px solid var(--color-white); }
        .photo-item--cloud { border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; aspect-ratio: 5/4; border: 3px solid var(--color-gold); }
        .photo-item--pill { border-radius: 999px; aspect-ratio: 16/10; border: 3px solid var(--color-green); }
        .photo-item--round { border-radius: 24px; aspect-ratio: 1; transform: rotate(2deg); border: 3px solid var(--color-red); }

        .tips-section { background: linear-gradient(135deg, var(--color-cream) 0%, #E0F4FF 100%); padding: 52px 60px; position: relative; }
        .tips-title { font-size: 34px; font-weight: 800; color: var(--color-red); letter-spacing: 2px; text-align: center; margin-bottom: 32px; text-shadow: 2px 2px 0 var(--color-gold); }
        .tips-grid--pop { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-bottom: 28px; }
        .tip-card--bubble { background: var(--color-white); border-radius: 28px 28px 28px 8px; padding: 24px; box-shadow: 4px 4px 0 var(--color-green); border: 2px solid var(--color-gold); }
        .tip-card h4 { font-size: 18px; font-weight: 700; color: var(--color-red); margin-bottom: 8px; }
        .tip-card p { font-size: 15px; color: var(--color-text); line-height: 1.85; margin: 0; }
        .closing-section { background: var(--color-white); border-radius: 28px; padding: 32px; text-align: center; border: 3px dashed var(--color-red); transform: rotate(-0.5deg); }
        .closing-section h3 { font-size: 24px; font-weight: 800; color: var(--color-red); margin-bottom: 12px; }
        .closing-section p { font-size: 16px; color: var(--color-text); line-height: 1.9; margin: 0; }
        .footer { height: 65px; background: var(--color-red); display: flex; align-items: center; justify-content: center; }
        .footer-star { font-size: 20px; margin: 0 8px; color: var(--color-white); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="dot-grid" aria-hidden="true"></div>
            <svg class="candy-float candy-1" width="60" height="60" viewBox="0 0 60 60"><circle cx="30" cy="30" r="26" fill="#FFE066" stroke="#FF85A2" stroke-width="3"/><path d="M30 4 L34 20 L30 30 L26 20 Z" fill="#FF85A2" opacity="0.6"/></svg>
            <svg class="candy-float candy-2" width="55" height="55" viewBox="0 0 55 55"><rect x="8" y="8" width="39" height="39" rx="12" fill="#7DD3FC" transform="rotate(15 27.5 27.5)"/></svg>
            <svg class="candy-float candy-3" width="48" height="48" viewBox="0 0 48 48"><polygon points="24,2 44,14 44,34 24,46 4,34 4,14" fill="#C084FC" stroke="#FF85A2" stroke-width="2"/></svg>
            <svg class="candy-float candy-4" width="52" height="52" viewBox="0 0 52 52"><ellipse cx="26" cy="26" rx="22" ry="18" fill="#FF85A2"/><ellipse cx="26" cy="26" rx="12" ry="10" fill="#FFD6E8"/></svg>
            <div class="header-content">
                <div class="main-title">
                    <div class="title-en"><span class="name">Infant D</span></div>
                    <div class="title-sub">Biweekly Newsletter</div>
                </div>
                <div class="sub-title">从家庭走向集体的第一步</div>
                <div class="intro-text">
                    <p>宝贝入园的两周，是他们从家庭走向集体的第一步。我们见证了太多的"第一次"：第一次离开爸爸妈妈、第一次和这么多小伙伴一起吃饭睡觉、第一次在教室里放声大笑……虽然只有短短10天，但每一个宝贝都在用自己的节奏适应着这个新环境。</p>
                </div>
                <div class="week-info">
                    <span class="info-badge">2026.3.2 - 2026.3.13</span>
                </div>
            </div>
        </div>
