<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INFANT D Weekly Newsletter</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "PingFang SC", "Noto Sans SC", "STKaiti", Georgia, serif; background: #FAF7F2; width: 1080px; margin: 0 auto; }
        .container { width: 1080px; position: relative; overflow-x: clip; }
        :root {
            --color-red: #4A6741; --color-gold: #E8C4C4; --color-green: #7A9E7E; --color-cream: #EEF3E8;
            --color-bg: #FAF7F2; --color-white: #FFFFFF; --color-text: #3D4A38; --color-text-light: #6B7B65;
        }
        .header { min-height: 580px; background: linear-gradient(135deg, var(--color-cream) 0%, #F5EDE0 55%, var(--color-gold) 100%); position: relative; overflow: visible; }
        .leaf-deco { position: absolute; opacity: 0.35; }
        .leaf-1 { top: 40px; right: 60px; transform: rotate(15deg); }
        .leaf-2 { bottom: 140px; left: 40px; transform: rotate(-25deg) scale(0.8); }
        .leaf-3 { top: 200px; left: 520px; opacity: 0.2; transform: rotate(45deg); }
        .header-wave { position: absolute; bottom: 0; left: 0; width: 100%; height: 80px; }
        .header-content { position: relative; z-index: 10; padding: 80px 70px 90px 100px; max-width: 720px; }
        .main-title { margin-bottom: 18px; text-align: left; }
        .title-en { font-family: Georgia, "Times New Roman", serif; font-size: 88px; font-weight: 700; color: var(--color-text); letter-spacing: 3px; line-height: 1.05; font-style: italic; }
        .title-en .name { font-size: 102px; color: var(--color-red); font-style: normal; }
        .title-sub { font-size: 22px; font-weight: 500; color: var(--color-green); letter-spacing: 8px; margin-top: 10px; text-transform: uppercase; }
        .sub-title { font-size: 30px; font-weight: 600; color: var(--color-red); margin: 28px 0 24px; letter-spacing: 1px; line-height: 1.4; }
        .intro-text { background: rgba(255,255,255,0.85); border-radius: 4px 28px 28px 28px; padding: 32px 40px; box-shadow: 0 8px 32px rgba(74, 103, 65, 0.12); border-left: 5px solid var(--color-green); backdrop-filter: blur(4px); }
        .intro-text p { font-size: 18px; color: var(--color-text); line-height: 2; margin: 0; text-align: justify; }
        .week-info { margin-top: 32px; }
        .info-badge { display: inline-block; background: var(--color-red); padding: 12px 36px; border-radius: 40px 40px 40px 8px; font-size: 19px; font-weight: 600; color: var(--color-white); letter-spacing: 1px; box-shadow: 0 4px 16px rgba(74, 103, 65, 0.25); }

        /* —— dynamic body: storybook zigzag —— */
        .section-header { display: flex; align-items: center; gap: 20px; margin-bottom: 28px; }
        .section-icon { width: 58px; height: 58px; background: var(--color-gold); border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 26px; flex-shrink: 0; }
        .photo-grid { display: grid; gap: 16px; margin-top: 25px; }
        .photo-grid.grid-2 { grid-template-columns: repeat(2, 1fr); }
        .photo-grid.grid-3 { grid-template-columns: repeat(3, 1fr); }
        .photo-grid.grid-4 { grid-template-columns: repeat(4, 1fr); }
        .photo-item { position: relative; overflow: hidden; box-shadow: 0 6px 24px rgba(74, 103, 65, 0.15); aspect-ratio: 16 / 9; border-radius: 16px; }
        .section { padding: 48px 70px; position: relative; }
        .section--story { display: grid; grid-template-columns: 1fr 1fr; gap: 36px; align-items: start; }
        .section--story[data-flow="right"] { direction: rtl; }
        .section--story[data-flow="right"] > * { direction: ltr; }
        .section-header--story { grid-column: 1 / -1; display: flex; align-items: flex-start; gap: 16px; margin-bottom: 8px; }
        .section-marker { width: 12px; height: 12px; background: var(--color-gold); border-radius: 50% 50% 50% 0; flex-shrink: 0; margin-top: 12px; transform: rotate(-45deg); }
        .section-title { font-size: 34px; font-weight: 700; color: var(--color-red); letter-spacing: 2px; line-height: 1.3; }
        .section-subtitle { font-size: 14px; color: var(--color-green); margin-top: 6px; font-weight: 400; letter-spacing: 1px; }
        .story-body { display: flex; flex-direction: column; gap: 16px; }
        .content-box { background: var(--color-white); border-radius: 8px 24px 24px 24px; padding: 28px 32px; box-shadow: 0 4px 20px rgba(74, 103, 65, 0.08); }
        .content-box p { font-size: 17px; line-height: 1.95; color: var(--color-text); margin-bottom: 12px; }
        .content-box strong { color: var(--color-red); font-weight: 600; }
        .highlight-box { background: var(--color-cream); border-radius: 20px; padding: 22px 28px; border: 1px dashed var(--color-green); }
        .highlight-box p { font-size: 16px; color: var(--color-text); line-height: 1.85; margin: 0; }
        .list-item { display: flex; gap: 14px; padding: 18px 22px; background: var(--color-bg); border-radius: 16px; border-left: 4px solid var(--color-gold); margin-bottom: 12px; }
        .list-icon { font-size: 22px; flex-shrink: 0; }
        .list-content h4 { font-size: 18px; font-weight: 600; color: var(--color-red); margin-bottom: 6px; }
        .list-content p { font-size: 16px; color: var(--color-text); line-height: 1.8; margin: 0; }

        .photo-mosaic { display: grid; gap: 14px; align-content: start; }
        .photo-mosaic.mosaic-6 { grid-template-columns: repeat(3, 1fr); }
        .photo-mosaic.mosaic-8 { grid-template-columns: repeat(4, 1fr); }
        .photo-mosaic.mosaic-auto { grid-template-columns: repeat(3, 1fr); }
        .photo-item { position: relative; overflow: hidden; box-shadow: 0 6px 24px rgba(74, 103, 65, 0.15); }
        .photo-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .photo-item--circle { aspect-ratio: 1; border-radius: 50%; border: 4px solid var(--color-white); }
        .photo-item--blob { aspect-ratio: 4/5; border-radius: 60% 40% 55% 45% / 50% 60% 40% 50%; border: 3px solid var(--color-gold); }
        .photo-item--leaf { aspect-ratio: 5/4; clip-path: polygon(50% 0%, 95% 35%, 80% 100%, 20% 100%, 5% 35%); }

        .tips-section { background: var(--color-cream); padding: 56px 70px; position: relative; overflow: hidden; }
        .tips-section::before { content: ''; position: absolute; bottom: -80px; left: -80px; width: 240px; height: 240px; background: var(--color-gold); border-radius: 50%; opacity: 0.25; }
        .tips-title { font-size: 32px; font-weight: 700; color: var(--color-red); letter-spacing: 2px; text-align: center; margin-bottom: 36px; }
        .tips-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; margin-bottom: 28px; }
        .tip-card { background: var(--color-white); border-radius: 20px; padding: 24px; box-shadow: 0 4px 18px rgba(0,0,0,0.06); }
        .tip-card--leaf { border-radius: 24px 24px 24px 4px; border-top: 3px solid var(--color-green); }
        .tip-card h4 { font-size: 18px; font-weight: 600; color: var(--color-red); margin-bottom: 8px; }
        .tip-card p { font-size: 15px; color: var(--color-text); line-height: 1.85; margin: 0; }
        .closing-section { background: var(--color-white); border-radius: 24px; padding: 30px; text-align: center; border: 2px solid var(--color-green); }
        .closing-section h3 { font-size: 22px; font-weight: 700; color: var(--color-red); margin-bottom: 10px; }
        .closing-section p { font-size: 16px; color: var(--color-text); line-height: 1.9; margin: 0; }
        .footer { height: 65px; background: var(--color-red); display: flex; align-items: center; justify-content: center; }
        .footer-star { font-size: 20px; margin: 0 8px; color: var(--color-white); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <svg class="leaf-deco leaf-1" width="90" height="90" viewBox="0 0 90 90"><path d="M45 5 Q75 25 80 55 Q60 85 45 80 Q25 75 10 50 Q15 20 45 5" fill="#7A9E7E"/></svg>
            <svg class="leaf-deco leaf-2" width="70" height="70" viewBox="0 0 70 70"><path d="M35 4 Q58 20 62 42 Q45 62 35 58 Q18 52 8 35 Q12 15 35 4" fill="#E8C4C4"/></svg>
            <svg class="leaf-deco leaf-3" width="50" height="50" viewBox="0 0 50 50"><ellipse cx="25" cy="25" rx="20" ry="12" fill="#4A6741" transform="rotate(30 25 25)"/></svg>
            <svg class="header-wave" viewBox="0 0 1440 80" preserveAspectRatio="none">
                <path fill="#FAF7F2" d="M0,50 Q360,80 720,45 T1440,55 L1440,80 L0,80 Z"/>
            </svg>
            <div class="header-content">
                <div class="main-title">
                    <div class="title-en"><span class="name">Infant D</span></div>
                    <div class="title-sub">Biweekly Newsletter</div>
                </div>
                <div class="sub-title">从家庭走向集体的第一步</div>
                <div class="intro-text">
                    <p>宝贝入园的两周，是他们从家庭走向集体的第一步。我们见证了太多的"第一次"：第一次离开爸爸妈妈、第一次和这么多小伙伴一起吃饭睡觉、第一次在教室里放声大笑……虽然只有短短10天，但每一个宝贝都在用自己的节奏适应着这个新环境。</p>
                </div>
                <div class="week-info">
                    <span class="info-badge">2026.3.2 - 2026.3.13</span>
                </div>
            </div>
        </div>
